<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Alunos</title>
<style>
:root{
  --bg:#eef1f5;--surface:#fff;--ink:#1b2430;--muted:#5d6b7c;--line:#dde3ea;
  --brand:#2f4bc4;--brand-ink:#fff;--brand-soft:#e6eafb;
  --danger:#c0392b;--danger-soft:#fbe9e7;--ok:#1d7a4d;--ok-soft:#e3f4eb;
  --t1:#b45309;--t1s:#fdf0d9;--t2:#0f766e;--t2s:#dcf3f0;--t3:#7c3aed;--t3s:#eee6fd;
  --radius:10px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#12171f;--surface:#1b222c;--ink:#e8edf3;--muted:#99a6b6;--line:#2b3542;
  --brand:#7e95ff;--brand-ink:#0f1522;--brand-soft:#242e52;
  --danger:#ff8b7d;--danger-soft:#3a2220;--ok:#56d39a;--ok-soft:#173528;
  --t1:#f5b968;--t1s:#3b2d17;--t2:#5fd4c8;--t2s:#133632;--t3:#b99bff;--t3s:#2c2347;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px}
h1{font-size:1.35rem;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
h2{font-size:1.05rem;margin:0 0 16px}
main{padding:24px 0 48px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat span{display:block;color:var(--muted);font-size:.85rem}
.stat strong{font-size:1.7rem;font-weight:650;letter-spacing:-.02em}
.layout{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.field{margin-bottom:14px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px}
input,select{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.82rem;min-height:1.1em;margin-top:4px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn.link{border-color:transparent;background:none;color:var(--danger)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:1fr 160px auto;gap:10px;margin-bottom:14px}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th button{all:unset;cursor:pointer;font-weight:650;font-size:.85rem;color:var(--muted);display:inline-flex;gap:5px}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:3px solid var(--brand)}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.mail{color:var(--muted);font-size:.9rem;word-break:break-all}
.badge{padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:650;white-space:nowrap}
.t1{background:var(--t1s);color:var(--t1)}.t2{background:var(--t2s);color:var(--t2)}.t3{background:var(--t3s);color:var(--t3)}
td.row-actions{white-space:nowrap;text-align:right}
.empty{text-align:center;padding:36px 10px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:50}
.toast{padding:11px 16px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px #0003;animation:in .18s ease-out}
.toast.ok{background:var(--ok-soft);color:var(--ok)}.toast.bad{background:var(--danger-soft);color:var(--danger)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);max-width:400px;padding:22px}
dialog::backdrop{background:#0008}
h2+.bars{margin-top:-4px}
.dist{margin-bottom:22px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:64px 1fr 28px;align-items:center;gap:10px;font-size:.9rem}
.bar .track{background:var(--bg);border-radius:99px;height:10px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width .25s}
.bar b{text-align:right}
.pp{display:flex;align-items:center;gap:8px;margin:0;font-weight:400}
.pp select{width:auto;padding:5px 8px}
.backup{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.toast button{all:unset;cursor:pointer;margin-left:14px;text-decoration:underline}
.toast button:focus-visible{outline:2px solid currentColor}
small{font-weight:400;color:var(--muted)}
@media print{header.top button,.layout>.panel:first-child,.toolbar,.pager,.backup,.row-actions,.toasts{display:none!important}.layout{grid-template-columns:1fr}}
@media (max-width:860px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{grid-column:span 2}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>Cadastro de Alunos</h1><p>Cadastre, busque e organize as turmas.</p></div>
  <button class="btn" id="tema" type="button" aria-pressed="false">Modo escuro</button>
</div></header>

<main class="wrap">
  <section class="stats" aria-label="Resumo">
    <div class="stat"><span>Total de alunos</span><strong id="sTotal">0</strong></div>
    <div class="stat"><span>Idade média</span><strong id="sIdade">–</strong></div>
    <div class="stat"><span>Maior turma</span><strong id="sTurma">–</strong></div>
    <div class="stat"><span>Exibindo agora</span><strong id="sFiltro">0</strong></div>
  </section>

  <section class="panel dist" aria-label="Alunos por turma"><h2>Alunos por turma</h2><div class="bars" id="barras"></div></section>

  <div class="layout">
    <section class="panel">
      <h2 id="formTitulo">Novo aluno</h2>
      <form id="form" novalidate>
        <div class="field"><label for="nome">Nome completo</label>
          <input id="nome" autocomplete="off" placeholder="Ex.: Ana Souza" maxlength="80"><div class="err" id="eNome"></div></div>
        <div class="field"><label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="off" placeholder="ana@escola.com" maxlength="100"><div class="err" id="eEmail"></div></div>
        <div class="field"><label for="telefone">Telefone <small>(opcional)</small></label>
          <input id="telefone" inputmode="tel" autocomplete="off" placeholder="(11) 91234-5678" maxlength="15"><div class="err" id="eTelefone"></div></div>
        <div class="field"><label for="idade">Idade</label>
          <input id="idade" type="number" inputmode="numeric" placeholder="Ex.: 16"><div class="err" id="eIdade"></div></div>
        <div class="field"><label for="turma">Turma</label>
          <select id="turma"><option value="">Selecione...</option><option>1º ADS</option><option>2º ADS</option><option>3º ADS</option></select><div class="err" id="eTurma"></div></div>
        <div class="actions">
          <button class="btn primary" type="submit" id="salvar">Cadastrar aluno</button>
          <button class="btn" type="button" id="limpar">Limpar</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Alunos cadastrados</h2>
      <div class="toolbar">
        <input id="busca" type="search" placeholder="Buscar por nome ou e-mail (atalho: /)" aria-label="Buscar aluno por nome ou e-mail">
        <select id="filtroTurma" aria-label="Filtrar por turma"><option value="">Todas as turmas</option><option>1º ADS</option><option>2º ADS</option><option>3º ADS</option></select>
        <button class="btn" type="button" id="csv">Exportar CSV</button>
      </div>
      <div class="tablebox">
        <table>
          <thead><tr>
            <th aria-sort="ascending" id="thNome"><button data-campo="nome" type="button">Nome <i></i></button></th>
            <th><button data-campo="email" type="button">E-mail <i></i></button></th>
            <th><button data-campo="idade" type="button">Idade <i></i></button></th>
            <th><button data-campo="turma" type="button">Turma <i></i></button></th>
            <th><span class="sr" style="font-size:.85rem;color:var(--muted);font-weight:650">Ações</span></th>
          </tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="infoPag"></span>
        <label class="pp">Por página <select id="porPag" aria-label="Alunos por página"><option>5</option><option>10</option><option>20</option></select></label>
        <div class="actions"><button class="btn sm" id="ant" type="button">Anterior</button><button class="btn sm" id="prox" type="button">Próxima</button></div>
      </div>
      <div class="actions backup">
        <button class="btn sm" type="button" id="backup">Baixar backup (JSON)</button>
        <button class="btn sm" type="button" id="btnImportar">Restaurar backup</button>
        <input type="file" id="importar" accept=".json,application/json" hidden>
      </div>
    </section>
  </div>
</main>

<dialog id="confirma">
  <h2>Excluir aluno?</h2>
  <p id="confirmaTxt" style="margin:0 0 18px;color:var(--muted)"></p>
  <div class="actions" style="justify-content:flex-end">
    <button class="btn" id="cancelaDel" type="button">Cancelar</button>
    <button class="btn danger" id="okDel" type="button">Excluir</button>
  </div>
</dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const KEY = 'alunos-v1';
const $ = id => document.getElementById(id);
const SEED = [
  {id:1,nome:'Lucas Lima',email:'lucas@escola.com',idade:16,turma:'2º ADS'},
  {id:2,nome:'Marina Alves',email:'marina@escola.com',idade:17,turma:'3º ADS'},
  {id:3,nome:'Ana Souza',email:'ana@escola.com',idade:16,turma:'2º ADS'}
];

// ---------- Estado (fonte da verdade) ----------
let alunos = carregar();
const estado = {busca:'', turma:'', campo:'nome', dir:1, pagina:1, porPagina:5, editId:null, delId:null};

function carregar(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(d)) return d; } catch(e){}
  return SEED.slice();
}
function salvarLocal(){ try { localStorage.setItem(KEY, JSON.stringify(alunos)); } catch(e){} }
const proximoId = () => alunos.reduce((m,a) => Math.max(m,a.id), 0) + 1;
const normalizar = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

// ---------- Validação (cada função cuida de um campo) ----------
function validarNome(v){
  v = v.trim().replace(/\s+/g,' ');
  if (!v) return 'Informe o nome completo.';
  if (v.length < 3 || v.split(' ').length < 2) return 'Digite nome e sobrenome.';
  if (!/^[\p{L}][\p{L}' .-]*$/u.test(v)) return 'Use apenas letras no nome.';
  return '';
}
function validarEmail(v){
  v = v.trim();
  if (!v) return 'Informe o e-mail.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Digite um e-mail válido, como ana@escola.com.';
  const dup = alunos.some(a => a.email.toLowerCase() === v.toLowerCase() && a.id !== estado.editId);
  return dup ? 'Já existe um aluno com este e-mail.' : '';
}
function validarIdade(v){
  if (v === '') return 'Informe a idade.';
  const n = Number(v);
  if (!Number.isInteger(n)) return 'A idade deve ser um número inteiro.';
  if (n < 5 || n > 100) return 'A idade deve estar entre 5 e 100 anos.';
  return '';
}
function validarTelefone(v){
  const d = v.replace(/\D/g,'');
  if (!d) return '';
  if (d.length < 10 || d.length > 11) return 'Digite o DDD e o número, ex.: (11) 91234-5678.';
  if (d.length === 11 && d[2] !== '9') return 'Celular deve começar com 9 depois do DDD.';
  return '';
}
const validarTurma = v => v ? '' : 'Selecione a turma.';

const CAMPOS = {
  nome:[validarNome,'eNome'], email:[validarEmail,'eEmail'],
  idade:[validarIdade,'eIdade'], turma:[validarTurma,'eTurma'],
  telefone:[validarTelefone,'eTelefone']
};
function validarCampo(campo){
  const [fn, idErro] = CAMPOS[campo];
  const msg = fn($(campo).value);
  $(idErro).textContent = msg;
  $(campo).setAttribute('aria-invalid', msg ? 'true' : 'false');
  return !msg;
}

// ---------- Renderização ----------
function filtrados(){
  const termo = normalizar(estado.busca.trim());
  const lista = alunos.filter(a =>
    (!estado.turma || a.turma === estado.turma) &&
    (!termo || normalizar(a.nome).includes(termo) || normalizar(a.email).includes(termo)));
  lista.sort((a,b) => {
    const x = a[estado.campo], y = b[estado.campo];
    const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR');
    return r * estado.dir;
  });
  return lista;
}
function iniciais(nome){
  const p = nome.trim().split(/\s+/);
  return (p[0][0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
}
function celula(tr, filho){ const td = document.createElement('td'); td.append(filho); tr.append(td); return td; }
function botao(txt, cls, fn, aria){
  const b = document.createElement('button');
  b.type = 'button'; b.className = cls; b.textContent = txt; b.setAttribute('aria-label', aria); b.onclick = fn;
  return b;
}
function linha(a){
  const tr = document.createElement('tr');
  const who = document.createElement('div'); who.className = 'who';
  const av = document.createElement('span'); av.className = 'avatar'; av.textContent = iniciais(a.nome);
  const nm = document.createElement('span'); nm.textContent = a.nome;   // textContent: seguro contra XSS
  who.append(av, nm); celula(tr, who);
  const mail = document.createElement('div'); mail.className = 'mail'; mail.textContent = a.email;
  if (a.telefone){ const t = document.createElement('div'); t.textContent = a.telefone; mail.append(t); }
  celula(tr, mail);
  celula(tr, document.createTextNode(String(a.idade)));
  const b = document.createElement('span');
  b.className = 'badge t' + a.turma[0]; b.textContent = a.turma; celula(tr, b);
  const td = document.createElement('td'); td.className = 'row-actions';
  td.append(botao('Editar','btn sm',() => editar(a.id),'Editar ' + a.nome), ' ',
            botao('Excluir','btn sm link',() => pedirExclusao(a.id),'Excluir ' + a.nome));
  tr.append(td);
  return tr;
}
function renderizar(){
  const lista = filtrados();
  const paginas = Math.max(1, Math.ceil(lista.length / estado.porPagina));
  estado.pagina = Math.min(estado.pagina, paginas);
  const ini = (estado.pagina - 1) * estado.porPagina;
  const tbody = $('lista'); tbody.replaceChildren();

  if (!lista.length){
    const tr = document.createElement('tr'), td = document.createElement('td');
    td.colSpan = 5; td.className = 'empty';
    td.textContent = alunos.length ? 'Nenhum aluno encontrado. Tente outro nome ou limpe os filtros.' : 'Nenhum aluno cadastrado. Use o formulário para adicionar o primeiro.';
    tr.append(td); tbody.append(tr);
  } else lista.slice(ini, ini + estado.porPagina).forEach(a => tbody.append(linha(a)));

  $('infoPag').textContent = lista.length ? `Página ${estado.pagina} de ${paginas} · ${lista.length} aluno(s)` : '';
  $('ant').disabled = estado.pagina <= 1;
  $('prox').disabled = estado.pagina >= paginas;

  document.querySelectorAll('th').forEach(th => th.removeAttribute('aria-sort'));
  document.querySelectorAll('th button').forEach(btn => {
    const ativo = btn.dataset.campo === estado.campo;
    btn.querySelector('i').textContent = ativo ? (estado.dir === 1 ? '▲' : '▼') : '';
    if (ativo) btn.parentElement.setAttribute('aria-sort', estado.dir === 1 ? 'ascending' : 'descending');
  });
  atualizarResumo(lista.length);
}
function atualizarResumo(exibindo){
  $('sTotal').textContent = alunos.length;
  $('sFiltro').textContent = exibindo;
  $('sIdade').textContent = alunos.length ? (alunos.reduce((s,a) => s + a.idade, 0) / alunos.length).toFixed(1).replace('.',',') : '–';
  const cont = {}; alunos.forEach(a => cont[a.turma] = (cont[a.turma] || 0) + 1);
  const top = Object.entries(cont).sort((a,b) => b[1] - a[1])[0];
  $('sTurma').textContent = top ? top[0] : '–';
  const barras = $('barras'); barras.replaceChildren();
  ['1º ADS','2º ADS','3º ADS'].forEach(t => {
    const n = cont[t] || 0, pct = alunos.length ? n / alunos.length * 100 : 0;
    const row = document.createElement('div'); row.className = 'bar';
    const nome = document.createElement('span'); nome.textContent = t;
    const trilho = document.createElement('div'); trilho.className = 'track';
    const f = document.createElement('div'); f.className = 'fill'; f.style.width = pct + '%'; f.style.background = `var(--t${t[0]})`;
    trilho.append(f);
    const q = document.createElement('b'); q.textContent = n;
    row.append(nome, trilho, q); barras.append(row);
  });
}

// ---------- Ações ----------
function toast(txt, tipo = 'ok', acao){
  const t = document.createElement('div'); t.className = 'toast ' + tipo; t.textContent = txt;
  if (acao){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = acao.label;
    b.onclick = () => { acao.fn(); t.remove(); };
    t.append(b);
  }
  $('toasts').append(t); setTimeout(() => t.remove(), acao ? 7000 : 3200);
}
function limparFormulario(){
  $('form').reset();
  Object.keys(CAMPOS).forEach(c => { $(CAMPOS[c][1]).textContent = ''; $(c).removeAttribute('aria-invalid'); });
  estado.editId = null;
  $('formTitulo').textContent = 'Novo aluno';
  $('salvar').textContent = 'Cadastrar aluno';
  $('limpar').textContent = 'Limpar';
}
function editar(id){
  const a = alunos.find(x => x.id === id); if (!a) return;
  estado.editId = id;
  ['nome','email','idade','turma','telefone'].forEach(c => $(c).value = a[c] || '');
  $('formTitulo').textContent = 'Editar aluno';
  $('salvar').textContent = 'Salvar alterações';
  $('limpar').textContent = 'Cancelar edição';
  $('nome').focus();
}
function pedirExclusao(id){
  const a = alunos.find(x => x.id === id); if (!a) return;
  estado.delId = id;
  $('confirmaTxt').textContent = `${a.nome} será removido da lista. Essa ação não pode ser desfeita.`;
  $('confirma').showModal();
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const ok = Object.keys(CAMPOS).map(validarCampo).every(Boolean);   // valida todos, sem parar no primeiro erro
  if (!ok){ toast('Corrija os campos destacados.', 'bad'); return; }
  const dados = {
    nome: $('nome').value.trim().replace(/\s+/g,' '),
    email: $('email').value.trim().toLowerCase(),
    idade: Number($('idade').value),
    turma: $('turma').value,
    telefone: $('telefone').value.trim()
  };
  if (estado.editId){
    alunos = alunos.map(a => a.id === estado.editId ? {...a, ...dados} : a);
    toast('Aluno atualizado.');
  } else {
    alunos.push({id: proximoId(), ...dados});
    toast('Aluno cadastrado.');
  }
  salvarLocal(); limparFormulario(); renderizar();
});
$('limpar').addEventListener('click', limparFormulario);
Object.keys(CAMPOS).forEach(c => $(c).addEventListener('blur', () => { if ($(c).value !== '') validarCampo(c); }));

$('okDel').addEventListener('click', () => {
  const removido = alunos.find(a => a.id === estado.delId);
  alunos = alunos.filter(a => a.id !== estado.delId);
  if (estado.editId === estado.delId) limparFormulario();
  salvarLocal(); $('confirma').close(); renderizar();
  toast('Aluno excluído.', 'ok', {label:'Desfazer', fn: () => { alunos.push(removido); salvarLocal(); renderizar(); }});
});
$('cancelaDel').addEventListener('click', () => $('confirma').close());

$('busca').addEventListener('input', e => { estado.busca = e.target.value; estado.pagina = 1; renderizar(); });
$('filtroTurma').addEventListener('change', e => { estado.turma = e.target.value; estado.pagina = 1; renderizar(); });
$('ant').addEventListener('click', () => { estado.pagina--; renderizar(); });
$('prox').addEventListener('click', () => { estado.pagina++; renderizar(); });
document.querySelectorAll('th button').forEach(btn => btn.addEventListener('click', () => {
  const c = btn.dataset.campo;
  estado.dir = estado.campo === c ? -estado.dir : 1;
  estado.campo = c; renderizar();
}));

// ---------- Exportar CSV ----------
$('csv').addEventListener('click', () => {
  const lista = filtrados();
  if (!lista.length){ toast('Não há alunos para exportar.', 'bad'); return; }
  const esc = v => {
    let s = String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;          // evita injeção de fórmulas no Excel
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const linhas = [['Nome','E-mail','Telefone','Idade','Turma'], ...lista.map(a => [a.nome, a.email, a.telefone || '', a.idade, a.turma])];
  const blob = new Blob(['\ufeff' + linhas.map(l => l.map(esc).join(';')).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'alunos.csv'; a.click();
  URL.revokeObjectURL(a.href);
});

// ---------- Extras: itens por página, atalho, máscara, backup ----------
$('porPag').addEventListener('change', e => { estado.porPagina = Number(e.target.value); estado.pagina = 1; renderizar(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); $('busca').focus(); }
});
$('telefone').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g,'').slice(0,11);
  let s = d;
  if (d.length > 10) s = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  else if (d.length > 6) s = `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  else if (d.length > 2) s = `(${d.slice(0,2)}) ${d.slice(2)}`;
  else if (d.length) s = `(${d}`;
  e.target.value = s;
});
$('backup').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(alunos, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'backup-alunos.json'; a.click();
  URL.revokeObjectURL(a.href);
});
$('btnImportar').addEventListener('click', () => $('importar').click());
$('importar').addEventListener('change', e => {
  const arq = e.target.files[0]; if (!arq) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try {
      const dados = JSON.parse(leitor.result);
      if (!Array.isArray(dados)) throw new Error('formato');
      const emails = new Set(alunos.map(a => a.email.toLowerCase()));
      let novos = 0;
      dados.forEach(d => {                      // cada registro importado passa pela mesma validação do formulário
        const nome = String(d.nome || '').trim().replace(/\s+/g,' ');
        const email = String(d.email || '').trim().toLowerCase();
        const turma = String(d.turma || '');
        const tel = String(d.telefone || '');
        if (validarNome(nome) || validarIdade(String(d.idade ?? '')) || validarTelefone(tel)) return;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || emails.has(email)) return;
        if (!['1º ADS','2º ADS','3º ADS'].includes(turma)) return;
        emails.add(email);
        alunos.push({id: proximoId(), nome, email, idade: Number(d.idade), turma, telefone: tel});
        novos++;
      });
      salvarLocal(); renderizar();
      toast(`${novos} aluno(s) importado(s).`, novos ? 'ok' : 'bad');
    } catch (err) { toast('Arquivo inválido. Use um backup baixado por esta página.', 'bad'); }
    e.target.value = '';
  };
  leitor.readAsText(arq);
});

// ---------- Tema ----------
function aplicarTema(escuro){
  document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
  $('tema').textContent = escuro ? 'Modo claro' : 'Modo escuro';
  $('tema').setAttribute('aria-pressed', escuro);
}
let escuro = matchMedia('(prefers-color-scheme: dark)').matches;
try { const t = localStorage.getItem('tema-alunos'); if (t) escuro = t === 'dark'; } catch(e){}
aplicarTema(escuro);
$('tema').addEventListener('click', () => {
  escuro = !escuro; aplicarTema(escuro);
  try { localStorage.setItem('tema-alunos', escuro ? 'dark' : 'light'); } catch(e){}
});

renderizar();
</script>
